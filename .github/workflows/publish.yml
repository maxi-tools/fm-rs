# Publish to crates.io
#
# RUNNER POSTURE (2026-10-04, mac2linux audit) -- same shape as ci.yml, and the
# reasoning lives there in full. Briefly: hosted runners bill Actions minutes,
# and the fleet rule is zero hosted minutes outside the external runner-freeze
# watchdog, so `macos-26` and `ubuntu-latest` here are both self-hosted now.
#
# These lanes genuinely need an Apple Silicon Mac running macOS 26+ (they run the
# full test suite and link FoundationModels.framework), so `macos-arm64` is the
# correct destination rather than a cheaper substitute -- the preflight step is
# what keeps a drifted box from reporting green for a build it could not make.
#
# TRUST. This workflow only triggers on tag pushes, which require write access,
# so there is no fork-PR path here and no trust predicate is needed. The
# publishing jobs hold `id-token: write` for OIDC trusted publishing; nothing
# unreviewed ever reaches those on a persistent runner.

name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # e.g., v0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # e.g., v0.1.0-beta.1

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify the tag matches Cargo.toml version
  verify:
    name: Verify Release
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.FM_RS_MACOS_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Preflight
        run: bash .github/scripts/preflight-macos.sh

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) doesn't match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run tests before publish
        run: cargo test --all-features

  # Publish fm-rs-derive first (no Swift dependency)
  publish-derive:
    name: Publish fm-rs-derive
    needs: verify
    runs-on: ${{ fromJSON(vars.FM_RS_LINUX_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    environment: crates-io
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish fm-rs-derive
        run: cargo publish -p fm-rs-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Wait for crates.io to index the new version
      - name: Wait for crates.io indexing
        run: sleep 30

  # Publish fm-rs (depends on fm-rs-derive)
  publish-fm-rs:
    name: Publish fm-rs
    needs: [verify, publish-derive]
    # Requires macOS 26+ for FoundationModels.framework
    runs-on: ${{ fromJSON(vars.FM_RS_MACOS_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    environment: crates-io
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Preflight
        run: bash .github/scripts/preflight-macos.sh

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish fm-rs
        run: cargo publish -p fm-rs --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create GitHub Release
  release:
    name: Create Release
    needs: [verify, publish-fm-rs]
    runs-on: ${{ fromJSON(vars.FM_RS_LINUX_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Rust

            ```toml
            [dependencies]
            fm-rs = "${{ needs.verify.outputs.version }}"
            ```

            ## Python

            ```bash
            pip install fm-rs==${{ needs.verify.outputs.version }}
            ```

            ## Documentation

            - [docs.rs/fm-rs](https://docs.rs/fm-rs/${{ needs.verify.outputs.version }})
            - [crates.io/crates/fm-rs](https://crates.io/crates/fm-rs)
            - [pypi.org/project/fm-rs](https://pypi.org/project/fm-rs/${{ needs.verify.outputs.version }})