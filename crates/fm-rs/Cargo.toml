[package]
name = "fm-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors = ["blacktop"]
description = "Rust bindings for Apple's FoundationModels.framework"
readme = "../../README.md"
documentation = "https://docs.rs/fm-rs"
keywords = ["apple", "foundation-models", "ai", "llm", "apple-intelligence"]
categories = ["api-bindings", "os::macos-apis"]

[lib]
name = "fm_rs"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
fm-rs-derive = { workspace = true, optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
tokio = { version = "1", optional = true, features = ["sync"] }

[dev-dependencies]
reqwest.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
futures-util = { version = "0.3", default-features = false }

[features]
default = []
derive = ["fm-rs-derive"]
private-cloud-compute = []
# Async `Stream` over the blocking streaming API. Off by default so the crate
# keeps its zero-runtime-dependency posture for blocking callers.
async = ["dep:futures-core", "dep:futures-util", "dep:tokio"]

[[example]]
name = "async_stream"
required-features = ["async"]

[[example]]
name = "private_cloud_compute"
required-features = ["private-cloud-compute"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]

[package.metadata.release]
allow-branch = ["main"]
