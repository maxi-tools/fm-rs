# Configuration for fm-python builds run from this directory.
# The system Swift rpath is emitted by build.rs so workspace-root builds get it too.

# rust-lang/rust#157750: LLVM objcopy can produce a misaligned Mach-O string
# table when stripping, which macOS 27's dyld rejects.
[profile.release]
strip = "none"

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path/../../../",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path/../../../",
]
